<meta name="description" content="Private job-search tracker with a brutal ATS, pipeline board, Excel-style grid and Cal the assistant. Runs offline on your device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script>
  // Installable app + offline cache, only when served from a web address (not when opened from disk).
  if (/^https?:$/.test(location.protocol)) {
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</head>
<body>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a job-search command center — sidebar + working canvas on desktop, bottom tab bar on phone.
   Motif: the recruiter's highlighter. Matched keywords get highlighter yellow; knockouts get a red ATS stamp. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --surface-2: #f8f9fb; --sunken: #eceef2; --overlay: rgba(17, 21, 28, .42);
  --ink: #11151c; --ink-2: #454d5c; --muted: #737c8c; --line: #e2e5eb; --line-2: #cfd4dc;
  --accent: #ffd60a; --accent-ink: #1d1700; --accent-strong: #8a6a00; --accent-soft: #fff3b0; --hl: #ffe86b;
  --good: #0c7a34; --good-bg: #e3f5e9; --warn: #9a6400; --warn-bg: #fff1d6; --bad: #c42f2f; --bad-bg: #fde6e6; --info: #2a78d6; --info-bg: #e5effc;
  --st-saved: #7c8799; --st-applied: #2a78d6; --st-screen: #1baf7a; --st-assessment: #eda100; --st-interview: #6250d6; --st-final: #eb6834; --st-offer: #0ca30c; --st-accepted: #d55181; --st-rejected: #e34948; --st-ghosted: #5d6470; --st-withdrawn: #a39e93;
  --flow-active: #b9c2d0;
  --hm-0: #e8ebf0; --hm-1: #b7d3f6; --hm-2: #6da7ec; --hm-3: #2a78d6; --hm-4: #184f95;
  --shadow-1: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-2: 0 12px 32px -8px rgba(16, 24, 40, .18), 0 4px 10px -4px rgba(16, 24, 40, .08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 6px; --r: 10px; --r-lg: 14px;
  --side-w: 236px; --tab-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e15; --surface: #121823; --surface-2: #161d2a; --sunken: #0d121b; --overlay: rgba(0, 0, 0, .6);
    --ink: #e8ecf3; --ink-2: #b3bccb; --muted: #7e889a; --line: #222a38; --line-2: #2f3a4c;
    --accent: #f5c518; --accent-ink: #1d1700; --accent-strong: #f5c518; --accent-soft: rgba(245, 197, 24, .13); --hl: rgba(245, 197, 24, .32);
    --good: #3ccf6e; --good-bg: rgba(12, 163, 12, .16); --warn: #f2b84b; --warn-bg: rgba(250, 178, 25, .14); --bad: #ff7b7b; --bad-bg: rgba(227, 73, 72, .16); --info: #6da7ec; --info-bg: rgba(57, 135, 229, .16);
    --st-saved: #8a95a8; --st-applied: #3987e5; --st-screen: #199e70; --st-assessment: #c98500; --st-interview: #9085e9; --st-final: #d95926; --st-offer: #0ca30c; --st-accepted: #d55181; --st-rejected: #e66767; --st-ghosted: #6b7383; --st-withdrawn: #8f8a80;
    --flow-active: #3a4558;
    --hm-0: #1a2230; --hm-1: #184f95; --hm-2: #256abf; --hm-3: #3987e5; --hm-4: #86b6ef;
    --shadow-1: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 18px 40px -10px rgba(0, 0, 0, .7), 0 4px 12px -4px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e15; --surface: #121823; --surface-2: #161d2a; --sunken: #0d121b; --overlay: rgba(0, 0, 0, .6);
  --ink: #e8ecf3; --ink-2: #b3bccb; --muted: #7e889a; --line: #222a38; --line-2: #2f3a4c;
  --accent: #f5c518; --accent-ink: #1d1700; --accent-strong: #f5c518; --accent-soft: rgba(245, 197, 24, .13); --hl: rgba(245, 197, 24, .32);
  --good: #3ccf6e; --good-bg: rgba(12, 163, 12, .16); --warn: #f2b84b; --warn-bg: rgba(250, 178, 25, .14); --bad: #ff7b7b; --bad-bg: rgba(227, 73, 72, .16); --info: #6da7ec; --info-bg: rgba(57, 135, 229, .16);
  --st-saved: #8a95a8; --st-applied: #3987e5; --st-screen: #199e70; --st-assessment: #c98500; --st-interview: #9085e9; --st-final: #d95926; --st-offer: #0ca30c; --st-accepted: #d55181; --st-rejected: #e66767; --st-ghosted: #6b7383; --st-withdrawn: #8f8a80;
  --flow-active: #3a4558;
  --hm-0: #1a2230; --hm-1: #184f95; --hm-2: #256abf; --hm-3: #3987e5; --hm-4: #86b6ef;
  --shadow-1: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 18px 40px -10px rgba(0, 0, 0, .7), 0 4px 12px -4px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--info); }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ───── shell ───── */
#app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 4px; padding: 18px 12px 14px max(12px, env(safe-area-inset-left, 0px)); background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; position: relative; overflow: hidden; flex: none; }
.brand-mark::before { content: ""; position: absolute; left: 5px; right: 5px; top: 13px; height: 7px; background: var(--accent); transform: skewX(-12deg); border-radius: 1px; }
.brand-mark span { position: relative; font: 800 15px/1 var(--f-display); color: var(--bg); }
.brand-name { font: 800 19px/1 var(--f-display); letter-spacing: -.02em; }
.brand-sub { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: .02em; }
.nav-sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.nav a[aria-current="page"] .nav-count { background: rgba(255, 255, 255, .16); color: var(--bg); }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav-count { margin-left: auto; font: 600 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 6px; background: var(--sunken); color: var(--ink-2); }
.nav-count.hot { background: var(--accent); color: var(--accent-ink); }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding-top: 12px; }
.sync { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 10px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.cloud i { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
.sync.local i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.resume-mini { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: inherit; background: var(--surface-2); }
.resume-mini:hover { border-color: var(--line-2); }
.grade { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font: 800 17px/1 var(--f-display); }
.g-A, .g-B { background: var(--good-bg); color: var(--good); } .g-C { background: var(--warn-bg); color: var(--warn); } .g-D, .g-F { background: var(--bad-bg); color: var(--bad); } .g-none { background: var(--sunken); color: var(--muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: center; gap: 10px; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 21px; font-weight: 650; min-width: 0; }
.top .crumb { color: var(--muted); font-size: 12.5px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.search-btn { display: flex; align-items: center; gap: 8px; min-width: 220px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; }
.search-btn kbd { margin-left: auto; }
kbd { font: 600 10.5px/1 var(--f-mono); padding: 3px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; color: var(--ink-2); background: var(--surface-2); }
#view { padding-block: 20px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); min-width: 0; }
.tabbar { display: none; }

/* ───── controls ───── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 13px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, transform .08s; }
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--bg)); border-color: var(--ink); }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 70%, #000); }
.btn-accent:hover { background: color-mix(in srgb, var(--accent) 88%, #000); border-color: color-mix(in srgb, var(--accent) 60%, #000); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--sunken); border-color: transparent; }
.btn-danger { color: var(--bad); }
.btn-sm { padding: 5px 9px; font-size: 12px; border-radius: 7px; }
.btn-icon { padding: 7px; }
.claude-btn::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: conic-gradient(from 0deg, #d97757, #e8a07f, #d97757); flex: none; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span, .lbl { font-size: 11.5px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em; }
.input, select.input, textarea.input { width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.input:focus { outline: none; border-color: var(--info); box-shadow: 0 0 0 3px var(--info-bg); }
textarea.input { resize: vertical; min-height: 90px; line-height: 1.5; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 17px; height: 17px; margin-top: 1px; accent-color: var(--ink); flex: none; }
.seg-ctl { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--sunken); border: 1px solid var(--line); }
.seg-ctl button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg-ctl button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

/* ───── cards / dashboard ───── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; min-width: 0; box-shadow: var(--shadow-1); }
.card-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h3 { font-size: 15.5px; font-weight: 650; }
.card-h .sub { color: var(--muted); font-size: 12px; }
.card-h .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
.kpis { grid-column: span 12; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 14px 12px; display: grid; gap: 4px; align-content: start; position: relative; }
.kpi-l { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.kpi-v { font: 700 28px/1.1 var(--f-ui); letter-spacing: -.02em; }
.kpi-v small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.kpi-d { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi .spark { position: absolute; right: 12px; top: 14px; }
.delta-up { color: var(--good); font-weight: 600; } .delta-down { color: var(--bad); font-weight: 600; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); margin-bottom: 16px; font-size: 13px; }
.banner b { font-weight: 700; }
.banner .row { margin-left: auto; }
.tower { position: relative; height: 340px; border-radius: var(--r); background: radial-gradient(120% 90% at 50% 10%, var(--surface-2), var(--surface) 70%); overflow: hidden; }
.tower-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 8px; }

/* action center */
.actions { display: grid; gap: 6px; max-height: 392px; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.act { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.act-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.act-ic svg { width: 15px; height: 15px; }
.k-interview .act-ic { background: color-mix(in srgb, var(--st-interview) 18%, transparent); color: var(--st-interview); }
.k-thanks .act-ic, .k-outcome .act-ic { background: var(--good-bg); color: var(--good); }
.k-followup .act-ic { background: var(--info-bg); color: var(--info); }
.k-ghost .act-ic, .k-stale .act-ic { background: var(--sunken); color: var(--ink-2); }
.k-knockout .act-ic { background: var(--bad-bg); color: var(--bad); }
.k-deadline .act-ic { background: var(--warn-bg); color: var(--warn); }
.k-nojd .act-ic { background: var(--accent-soft); color: var(--accent-strong); }
.act-t { font-weight: 600; font-size: 13px; }
.act-d { font-size: 12px; color: var(--muted); }
.act button.link { all: unset; cursor: pointer; }
.act-t button.link:hover { text-decoration: underline; }

/* chips, badges, stamps */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.chip-solid { background: var(--c); border-color: var(--c); }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); background: var(--sunken); white-space: nowrap; }
.score { --sc: var(--muted); display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 24px; padding: 0 6px; border-radius: 7px; font: 700 12.5px/1 var(--f-mono); color: var(--sc); background: color-mix(in srgb, var(--sc) 13%, transparent); border: 1px solid color-mix(in srgb, var(--sc) 40%, transparent); font-variant-numeric: tabular-nums; }
.score.s-good { --sc: var(--good); } .score.s-warn { --sc: var(--warn); } .score.s-bad { --sc: var(--bad); }
.stamp { display: inline-flex; flex-direction: column; align-items: center; padding: 2px 8px; border: 2px solid currentColor; border-radius: 5px; font: 800 11px/1.15 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; transform: rotate(-4deg); white-space: nowrap; }
.stamp small { font-size: 9px; letter-spacing: .06em; font-weight: 600; opacity: .85; }
.stamp-REJECTED { color: var(--bad); background: var(--bad-bg); }
.stamp-STRONG { color: var(--good); background: var(--good-bg); }
.stamp-COMPETITIVE { color: var(--info); background: var(--info-bg); }
.stamp-LONG_SHOT { color: var(--warn); background: var(--warn-bg); }
.stamp-NO_RESUME, .stamp-NO_JD, .stamp-ERROR { color: var(--muted); background: var(--sunken); border-style: dashed; transform: none; }
.stamp-big { font-size: 22px; padding: 6px 16px; border-width: 4px; border-radius: 8px; transform: rotate(-7deg); box-shadow: inset 0 0 0 2px color-mix(in srgb, currentColor 25%, transparent); }
.stamp-big small { font-size: 11px; }
.stamp-anim { animation: slam .55s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes slam { 0% { transform: rotate(-7deg) scale(2.4); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotate(-7deg) scale(1); opacity: 1; } }
.mono-ava { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font: 700 13px/1 var(--f-display); color: #fff; flex: none; background: hsl(var(--h) 52% 42%); }
[data-theme="dark"] .mono-ava { background: hsl(var(--h) 45% 38%); }

/* ───── board ───── */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .input { width: auto; }
.toolbar .grow { flex: 1 1 200px; min-width: 160px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(268px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity; align-items: start; min-height: 60vh; }
.col { background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; min-height: 140px; transition: background .15s, border-color .15s; }
.col.drop { background: color-mix(in srgb, var(--c) 10%, var(--sunken)); border-color: var(--c); }

.jcard:hover .jc-move, .jcard:focus-within .jc-move { opacity: 1; }
.example-dot { font: 600 9.5px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-strong); background: var(--accent-soft); padding: 3px 5px; border-radius: 4px; }

/* ───── sheet (excel) ───── */

.xt thead .rn { z-index: 4; }

.xl-tabs button { border: 0; background: none; padding: 7px 14px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.xl-tabs button[aria-pressed="true"] { color: var(--st-offer); border-bottom-color: var(--st-offer); background: var(--surface); }

/* ───── tables (generic) ───── */

.t td.num, .t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scorebar { display: flex; align-items: center; gap: 8px; min-width: 120px; }

/* ───── ATS ───── */

.ring-host { position: relative; width: 132px; height: 132px; }

.comp { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) 36px; gap: 10px; align-items: center; padding: 6px 0; font-size: 12.5px; }

.skills-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.sk { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px; font-size: 12px; font-weight: 500; border: 1px solid var(--line); background: var(--surface-2); }
.sk i { font-style: normal; font-weight: 700; font-size: 11px; width: 14px; text-align: center; }
.sk small { color: var(--muted); font: 600 10.5px/1 var(--f-mono); }
.sk-evidenced { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 35%, transparent); } .sk-evidenced i { color: var(--good); }
.sk-listed { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 35%, transparent); } .sk-listed i { color: var(--warn); }

.sk-missing { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 35%, transparent); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 60%, transparent); } .sk-missing i { color: var(--bad); }
.jd-hl { white-space: pre-wrap; font-size: 13px; line-height: 1.65; max-height: 440px; overflow-y: auto; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }
mark.hl { color: inherit; border-radius: 3px; padding: 0 2px; }
.hl-evidenced { background: var(--hl); box-shadow: 0 -.4em 0 0 var(--hl) inset; }
.hl-listed { background: color-mix(in srgb, var(--warn) 22%, transparent); }
.hl-transferable { background: color-mix(in srgb, var(--info) 18%, transparent); }
.hl-alternative { background: color-mix(in srgb, var(--hl) 45%, transparent); }
.hl-missing { background: none; text-decoration: underline wavy var(--bad); text-underline-offset: 3px; font-weight: 600; }
.fix { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.fix:last-child { border-bottom: 0; }

.p1 { background: var(--bad-bg); color: var(--bad); } .p2 { background: var(--warn-bg); color: var(--warn); } .p3 { background: var(--sunken); color: var(--ink-2); }
.check-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }

.drop-zone { border: 2px dashed var(--line-2); border-radius: var(--r-lg); padding: 22px; text-align: center; display: grid; gap: 8px; place-items: center; background: var(--surface-2); transition: border-color .15s, background .15s; }
.drop-zone.over { border-color: var(--accent-strong); background: var(--accent-soft); }

.ai-out { font-size: 13.5px; line-height: 1.6; }

.thinking { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.thinking::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--ink); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ───── drawer / modal / toast / palette ───── */
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 70; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; z-index: 71; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--bg); border-left: 1px solid var(--line-2); box-shadow: var(--shadow-2); display: flex; flex-direction: column; animation: slidein .28s cubic-bezier(.2, .8, .2, 1) both; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
.dr-head { padding: 16px 20px 0; background: var(--surface); border-bottom: 1px solid var(--line); }
.dr-title { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.dr-title h2 { font-size: 20px; font-weight: 650; line-height: 1.2; }
.dr-title .co { color: var(--ink-2); font-weight: 600; font-size: 14px; }
.dr-tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.dr-tabs button { border: 0; background: none; padding: 9px 12px; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.dr-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

.stepper { display: flex; gap: 3px; margin-top: 12px; }

.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; position: relative; }
.tl::before { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl-dot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--surface); background: var(--c, var(--muted)); box-shadow: 0 0 0 1px var(--line-2); margin-top: 2px; }
.tl-t { font-size: 13px; font-weight: 600; }

.iv { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.iv-date { text-align: center; border-radius: 8px; background: var(--sunken); padding: 6px 0; }

.rte-bar { display: flex; gap: 2px; padding: 4px; border: 1px solid var(--line-2); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--surface-2); }
.rte-bar button { border: 0; background: none; width: 30px; height: 28px; border-radius: 6px; cursor: pointer; font-weight: 700; color: var(--ink-2); }
.rte-bar button:hover { background: var(--sunken); }
.rte { min-height: 160px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 0 0 8px 8px; background: var(--surface); line-height: 1.6; outline: none; }
.rte:focus { border-color: var(--info); }
.page-doc { background: #fff; color: #1a1a1a; border-radius: 4px; box-shadow: var(--shadow-2); padding: 44px 48px; font: 400 13.5px/1.65 Georgia, "Times New Roman", serif; max-width: 680px; white-space: pre-wrap; min-height: 360px; outline: none; }
.modal { position: fixed; z-index: 81; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 40px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-2); animation: pop .22s cubic-bezier(.2, .9, .3, 1.2) both; }

@keyframes pop { from { transform: translate(-50%, -46%) scale(.97); opacity: 0; } }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-h h3 { font-size: 17px; font-weight: 650; }
.modal-b { padding: 16px 18px; overflow-y: auto; display: grid; gap: 14px; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.scrim.top { z-index: 80; }
#toasts { position: fixed; z-index: 95; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); }
.toast { display: flex; gap: 12px; align-items: center; padding: 10px 12px 10px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-2); font-size: 13px; font-weight: 500; animation: pop2 .25s cubic-bezier(.2, .9, .3, 1.2) both; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.warn { background: var(--warn); color: #fff; }
.toast button { margin-left: auto; border: 0; background: rgba(255, 255, 255, .16); color: inherit; padding: 5px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; }
@keyframes pop2 { from { transform: translateY(10px); opacity: 0; } }
.palette { position: fixed; z-index: 91; left: 50%; top: calc(12vh + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(600px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-2); overflow: hidden; animation: pop2 .18s ease both; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 15px 16px; font-size: 15px; background: none; outline: none; }
.pal-list { max-height: 50vh; overflow-y: auto; padding: 6px; }
.pal-item { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.pal-item[aria-selected="true"] { background: var(--sunken); }
.pal-item .k { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.pal-sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 4px; }

/* ───── charts ───── */
.chart { display: block; max-width: 100%; overflow: visible; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-base { stroke: var(--line-2); stroke-width: 1; }
.c-tick { fill: var(--muted); font: 500 10.5px var(--f-ui); }

.c-bar { fill: var(--st-applied); transition: opacity .15s; }

[data-theme] .c-bar-accent, .c-bar-accent { fill: color-mix(in srgb, var(--accent) 75%, var(--ink) 25%); }
.c-bar-zero { fill: var(--line-2); }

.c-goal-t { fill: var(--ink-2); font-weight: 600; }

.c-hist-bad { fill: color-mix(in srgb, var(--st-rejected) 55%, transparent); }

.c-hist-good { fill: color-mix(in srgb, var(--st-offer) 55%, transparent); }
.c-hist-in { fill: var(--ink); opacity: .78; }
.flow-band { opacity: .42; transition: opacity .15s; }
.flow-band:hover, .flow-band:focus { opacity: .7; outline: none; }
.flow-exit { opacity: .55; transition: opacity .15s; }
.flow-exit:hover, .flow-exit:focus { opacity: .9; outline: none; }
.flow-label { fill: var(--ink-2); font: 600 11.5px var(--f-ui); }
.flow-num { fill: var(--ink); font: 700 11.5px var(--f-ui); }
.hm { stroke: none; } .hm-0 { fill: var(--hm-0); } .hm-1 { fill: var(--hm-1); } .hm-2 { fill: var(--hm-2); } .hm-3 { fill: var(--hm-3); } .hm-4 { fill: var(--hm-4); }
.hm-wrap { overflow-x: auto; }
.hm-legend { display: flex; gap: 4px; align-items: center; justify-content: flex-end; font-size: 11px; color: var(--muted); margin-top: 6px; }
.hm-sw { width: 11px; height: 11px; border-radius: 2.5px; display: inline-block; } .hm-sw.hm-0 { background: var(--hm-0); } .hm-sw.hm-1 { background: var(--hm-1); } .hm-sw.hm-2 { background: var(--hm-2); } .hm-sw.hm-3 { background: var(--hm-3); } .hm-sw.hm-4 { background: var(--hm-4); }
